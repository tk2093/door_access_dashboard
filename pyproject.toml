[project]
name = "door-access-dash"
version = "0.1.0"
description = "OpenPath Door Access Dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.19.0",
    "greenlet>=3.0.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.4",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
]

[project.scripts]
dev = "uvicorn backend.main:app --reload"

[dependency-groups]
dev = []
